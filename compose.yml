name: agentic-rag-project

services:

  # FastAPI application
  api:
    build: .
    mem_limit: 4g
    cpus: "2.0"
    container_name: rag-api
    ports:
      - "8000:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    environment:
      # Override OpenSearch host for container networking
      - OPENSEARCH__HOST=http://opensearch:9200
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - rag-network

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\"" ]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 90s
    networks:
      - rag-network

  db:
    image: postgres:16
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    mem_limit: 512m
    networks:
      - rag-network

  # OpenSearch — hybrid BM25 + vector search
  opensearch:
    image: opensearchproject/opensearch:2.19.5
    container_name: rag-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    networks:
      - rag-network

  worker:
      build: .                  # same image as api — no separate Dockerfile needed
      mem_limit: 4g
      cpus: "1.0"
      container_name: rag-worker
      command: ["arq", "src.services.cache.worker.WorkerSettings"]
      depends_on:
        opensearch:
          condition: service_healthy
      env_file:
        - .env
      environment:
        - OPENSEARCH__HOST=http://opensearch:9200
      networks:
        - rag-network
      # scale horizontally if job volume grows:
      # deploy:
      #   replicas: 2

networks:
  rag-network:

volumes:
  opensearch_data:
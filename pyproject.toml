[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.25.0",
    "asyncio>=4.0.0",
    "docling>=2.102.2",
    "fastapi[standard]>=0.137.1",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langchain-groq>=1.1.3",
    "langfuse>=4.12.0",
    "langgraph>=1.2.5",
    "litellm>=1.91.0",
    "logfire[fastapi,httpx,redis,sqlalchemy,system-metrics]>=4.37.0",
    "opensearch-py>=3.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pygraphviz>=2.0",
    "pytest>=9.1.1",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.13.0",
    "uvicorn>=0.49.0",

    # CPU-only torch to avoid ~2GB CUDA bloat in Docker images
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
[dependency-groups]
dev = [
    "anyio[trio]>=4.9.0",
    "asgi-lifespan>=2.1.0",
    "jupyter>=1.1.1",
    "mypy>=1.15.0",
    "notebook>=7.4.4",
    "polyfactory>=2.21.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-aiohttp>=1.1.0",
    "pytest-cov>=6.1.1",
    "pytest-dotenv>=0.5.2",
    "pytest-env>=1.1.5",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.5",
    "testcontainers>=4.10.0",
    "types-sqlalchemy>=1.4.53.38",
]
viz = [
    "grandalf>=0.8",
]

[tool.ruff]
line-length = 130
exclude = ["notebooks/**", ".venv/**"]
src = ["src", "tests"]
lint.select = [
  "I",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env_files = ".env.test"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }